spring.application.name=tier4

# Primary
spring.datasource.primary.jdbc-url=jdbc:postgresql://localhost:5432/payments
spring.datasource.primary.username=admin
spring.datasource.primary.password=secret

# Replica
spring.datasource.replica.jdbc-url=jdbc:postgresql://localhost:5433/payments
spring.datasource.replica.username=admin
spring.datasource.replica.password=secret

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.sql.init.mode=always
spring.datasource.hikari.maximum-pool-size=50

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=payment-processor
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.tier4.payment

spring.data.redis.host=localhost
spring.data.redis.port=6379