<svg viewBox="0 0 1300 900" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#5b8def"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4caf7d"/></marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e0a940"/></marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#b18cf2"/></marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e5534b"/></marker>
    <marker id="arrowGrey" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#8a8f98"/></marker>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#5bc8e0"/></marker>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1e2530"/><stop offset="100%" stop-color="#161b24"/></linearGradient>
    <linearGradient id="dbGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1f2b24"/><stop offset="100%" stop-color="#161f1a"/></linearGradient>
    <linearGradient id="kafkaGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2b2416"/><stop offset="100%" stop-color="#1f1a10"/></linearGradient>
    <linearGradient id="redisGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2b1a1a"/><stop offset="100%" stop-color="#1f1313"/></linearGradient>
    <linearGradient id="replicaGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a2530"/><stop offset="100%" stop-color="#131b24"/></linearGradient>
  </defs>

  <rect x="0" y="0" width="1300" height="900" fill="#0d1117"/>

  <text x="650" y="34" text-anchor="middle" fill="#e6edf3" font-size="22" font-weight="600">
    Full System Architecture — Tier 1 → 4
  </text>
  <text x="650" y="56" text-anchor="middle" fill="#7d8590" font-size="12.5">
    sync write path · async processing · cached balance reads · primary/replica routing with simulated replication lag
  </text>

  <!-- Client -->
  <g>
    <rect x="30" y="360" width="140" height="110" rx="10" fill="url(#boxGrad)" stroke="#30363d"/>
    <text x="100" y="400" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">Client</text>
    <text x="100" y="419" text-anchor="middle" fill="#7d8590" font-size="10.5">k6 / curl</text>
  </g>

  <!-- Spring Boot outer -->
  <rect x="230" y="90" width="380" height="700" rx="12" fill="#10151e" stroke="#242b36" stroke-dasharray="3,3"/>
  <text x="420" y="112" text-anchor="middle" fill="#7d8590" font-size="11" letter-spacing="1">SPRING BOOT :8080</text>

  <!-- RoutingAspect (top, cross-cutting) -->
  <g>
    <rect x="250" y="126" width="340" height="80" rx="10" fill="#161b24" stroke="#4a3a5c" stroke-dasharray="2,2"/>
    <text x="420" y="148" text-anchor="middle" fill="#b18cf2" font-size="12" font-weight="600">RoutingAspect (@Before)</text>
    <text x="420" y="166" text-anchor="middle" fill="#7d8590" font-size="9">reads @Transactional(readOnly) on every call</text>
    <text x="420" y="181" text-anchor="middle" fill="#7d8590" font-size="9">sets DataSourceContextHolder → PRIMARY or REPLICA</text>
    <text x="420" y="196" text-anchor="middle" fill="#7d8590" font-size="9">before the target method runs (Order=0)</text>
  </g>

  <!-- Payment block -->
  <g>
    <rect x="250" y="220" width="340" height="130" rx="10" fill="url(#boxGrad)" stroke="#30363d"/>
    <text x="420" y="242" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">Payment</text>
    <rect x="264" y="252" width="150" height="20" rx="5" fill="#111826" stroke="#2a3140"/>
    <text x="339" y="266" text-anchor="middle" fill="#9cc4ff" font-size="9" font-family="monospace">POST /payments</text>
    <rect x="420" y="252" width="156" height="20" rx="5" fill="#111826" stroke="#2a3140"/>
    <text x="498" y="266" text-anchor="middle" fill="#f2c879" font-size="9" font-family="monospace">GET /payments/{id}</text>
    <text x="420" y="290" text-anchor="middle" fill="#7d8590" font-size="8.5">getPayment() → readOnly → REPLICA</text>
    <text x="420" y="304" text-anchor="middle" fill="#7d8590" font-size="8.5">getPaymentForProcessing() → PRIMARY</text>
    <text x="420" y="318" text-anchor="middle" fill="#7d8590" font-size="8.5">idempotency UNIQUE + REQUIRES_NEW · pool=50</text>
    <text x="420" y="332" text-anchor="middle" fill="#7d8590" font-size="8.5">createPayment() writes PENDING → publishes event</text>
  </g>

  <!-- Account/Ledger block -->
  <g>
    <rect x="250" y="366" width="340" height="110" rx="10" fill="url(#boxGrad)" stroke="#30363d"/>
    <text x="420" y="388" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">Account / Ledger</text>
    <rect x="264" y="398" width="312" height="20" rx="5" fill="#111826" stroke="#2a3140"/>
    <text x="420" y="412" text-anchor="middle" fill="#9cc4ff" font-size="9" font-family="monospace">GET /accounts/{id}/balance</text>
    <rect x="264" y="422" width="150" height="18" rx="5" fill="#111826" stroke="#2a3140"/>
    <text x="339" y="435" text-anchor="middle" fill="#b18cf2" font-size="8.5" font-family="monospace">@Cacheable("balance")</text>
    <text x="420" y="460" text-anchor="middle" fill="#7d8590" font-size="8.5">SUM(amount) WHERE account_id=? · readOnly → REPLICA</text>
  </g>

  <!-- PaymentConsumer block -->
  <g>
    <rect x="250" y="490" width="340" height="120" rx="10" fill="url(#boxGrad)" stroke="#30363d"/>
    <text x="420" y="512" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">PaymentConsumer</text>
    <text x="420" y="528" text-anchor="middle" fill="#7d8590" font-size="9">@KafkaListener(concurrency="3")</text>
    <rect x="264" y="538" width="312" height="20" rx="5" fill="#111826" stroke="#2a3140"/>
    <text x="420" y="552" text-anchor="middle" fill="#e5534b" font-size="9" font-family="monospace">sleep(2000ms) — bank auth</text>
    <text x="420" y="574" text-anchor="middle" fill="#7d8590" font-size="8.5">getPaymentForProcessing() → PRIMARY (read-your-writes)</text>
    <text x="420" y="588" text-anchor="middle" fill="#7d8590" font-size="8.5">ledger write ×2 + status→SUCCEEDED + @CacheEvict</text>
  </g>

  <!-- ReplicationJob block -->
  <g>
    <rect x="250" y="626" width="340" height="110" rx="10" fill="#161b24" stroke="#2a4a5c" stroke-dasharray="2,2"/>
    <text x="420" y="648" text-anchor="middle" fill="#5bc8e0" font-size="13" font-weight="600">ReplicationJob</text>
    <text x="420" y="664" text-anchor="middle" fill="#7d8590" font-size="9">@Scheduled(fixedRate = 5000ms)</text>
    <rect x="264" y="674" width="312" height="20" rx="5" fill="#0f1a1e" stroke="#2a4a5c"/>
    <text x="420" y="688" text-anchor="middle" fill="#5bc8e0" font-size="8.5" font-family="monospace">WHERE updated_at &gt; now() - 15s</text>
    <text x="420" y="710" text-anchor="middle" fill="#7d8590" font-size="8.5">primary → replica, ON CONFLICT DO UPDATE</text>
    <text x="420" y="724" text-anchor="middle" fill="#7d8590" font-size="8.5">OVERRIDING SYSTEM VALUE (identity column)</text>
  </g>

  <text x="420" y="768" text-anchor="middle" fill="#565d68" font-size="9">config/ — KafkaConfig, RedisConfig, DataSourceConfig, RoutingAspect (cross-cutting, not domain logic)</text>

  <!-- Kafka -->
  <g>
    <rect x="660" y="90" width="220" height="140" rx="10" fill="url(#kafkaGrad)" stroke="#4a3e1f"/>
    <text x="770" y="120" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">Kafka</text>
    <text x="770" y="138" text-anchor="middle" fill="#7d8590" font-size="10.5">:9092 · 3 partitions</text>
    <rect x="678" y="150" width="184" height="26" rx="5" fill="#151109" stroke="#4a3e1f"/>
    <text x="770" y="167" text-anchor="middle" fill="#f2c879" font-size="10" font-family="monospace">payment.requested</text>
    <text x="770" y="197" text-anchor="middle" fill="#7d8590" font-size="9">group: payment-processor</text>
  </g>

  <!-- Redis -->
  <g>
    <rect x="660" y="260" width="220" height="120" rx="10" fill="url(#redisGrad)" stroke="#4a2a2a"/>
    <text x="770" y="290" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">Redis</text>
    <text x="770" y="308" text-anchor="middle" fill="#7d8590" font-size="10.5">:6379</text>
    <rect x="678" y="320" width="184" height="26" rx="5" fill="#151010" stroke="#4a2a2a"/>
    <text x="770" y="337" text-anchor="middle" fill="#f2a8a2" font-size="10" font-family="monospace">balance::{accountId}</text>
    <text x="770" y="366" text-anchor="middle" fill="#7d8590" font-size="9">evict-on-write, lazy refill</text>
  </g>

  <!-- Primary Postgres -->
  <g>
    <rect x="660" y="420" width="220" height="150" rx="10" fill="url(#dbGrad)" stroke="#2f4a37"/>
    <text x="770" y="450" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">Postgres — Primary</text>
    <text x="770" y="468" text-anchor="middle" fill="#7d8590" font-size="10">:5432</text>
    <rect x="678" y="480" width="184" height="24" rx="5" fill="#111826" stroke="#2a3140"/>
    <text x="770" y="496" text-anchor="middle" fill="#e6edf3" font-size="9.5">payments — PENDING → SUCCEEDED</text>
    <rect x="678" y="510" width="184" height="24" rx="5" fill="#111826" stroke="#2a3140"/>
    <text x="770" y="526" text-anchor="middle" fill="#e6edf3" font-size="9.5">ledger_entries — append-only</text>
    <text x="770" y="552" text-anchor="middle" fill="#7d8590" font-size="8.5">all writes land here — only source of truth</text>
  </g>

  <!-- Replica Postgres -->
  <g>
    <rect x="660" y="600" width="220" height="140" rx="10" fill="url(#replicaGrad)" stroke="#2a3d5c"/>
    <text x="770" y="630" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">Postgres — Replica</text>
    <text x="770" y="648" text-anchor="middle" fill="#7d8590" font-size="10">:5433</text>
    <rect x="678" y="660" width="184" height="24" rx="5" fill="#111826" stroke="#2a3140"/>
    <text x="770" y="676" text-anchor="middle" fill="#e6edf3" font-size="9.5">same schema, independent identity seq</text>
    <text x="770" y="700" text-anchor="middle" fill="#e5534b" font-size="8.5" font-weight="600">read-only · up to ~15s stale</text>
    <text x="770" y="716" text-anchor="middle" fill="#7d8590" font-size="8.5">no traffic here except replication + reads</text>
  </g>

  <!-- ============ ARROWS ============ -->

  <!-- Client -> Payment -->
  <path d="M170,395 L248,270" fill="none" stroke="#5b8def" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <circle r="4" fill="#8fb8ff"><animateMotion dur="1.1s" repeatCount="indefinite" path="M170,395 L246,272"/></circle>
  <text x="185" y="330" text-anchor="middle" fill="#5b8def" font-size="9">POST/GET payments</text>

  <!-- Client -> Account -->
  <path d="M170,430 L248,420" fill="none" stroke="#5b8def" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <circle r="4" fill="#8fb8ff"><animateMotion dur="1s" repeatCount="indefinite" path="M170,430 L246,421"/></circle>
  <text x="190" y="450" text-anchor="middle" fill="#5b8def" font-size="9">GET balance</text>

  <!-- Payment -> Kafka (publish) -->
  <path d="M590,255 L658,155" fill="none" stroke="#e0a940" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <circle r="4" fill="#f2c879"><animateMotion dur="1s" repeatCount="indefinite" path="M590,255 L656,156"/></circle>
  <text x="640" y="200" text-anchor="middle" fill="#e0a940" font-size="9">publish</text>

  <!-- Kafka -> Consumer -->
  <path d="M690,230 Q 610,400 588,545" fill="none" stroke="#e0a940" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <circle r="4" fill="#f2c879"><animateMotion dur="1.8s" repeatCount="indefinite" path="M690,230 Q 610,400 590,543"/></circle>

  <!-- Payment -> Primary (write PENDING) -->
  <path d="M590,290 Q 630,380 660,470" fill="none" stroke="#4caf7d" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
  <circle r="3.5" fill="#7fe0ab"><animateMotion dur="1.3s" repeatCount="indefinite" path="M590,290 Q 630,380 658,468"/></circle>

  <!-- Payment(getPaymentForProcessing) -> Primary -->
  <path d="M590,570 L660,500" fill="none" stroke="#4caf7d" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
  <circle r="3.5" fill="#7fe0ab"><animateMotion dur="1.2s" repeatCount="indefinite" path="M590,570 L658,502"/></circle>
  <text x="640" y="555" text-anchor="middle" fill="#4caf7d" font-size="8.5">read-your-writes</text>

  <!-- Consumer -> Primary (ledger writes) -->
  <path d="M590,555 L660,530" fill="none" stroke="#4caf7d" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
  <circle r="3.5" fill="#7fe0ab"><animateMotion dur="1.1s" repeatCount="indefinite" path="M590,555 L658,531"/></circle>

  <!-- Consumer -> Redis (evict) -->
  <path d="M590,510 Q 630,420 660,370" fill="none" stroke="#e5534b" stroke-width="1.8" stroke-dasharray="4,4" marker-end="url(#arrowRed)"/>
  <text x="645" y="440" text-anchor="middle" fill="#e5534b" font-size="8.5">evict</text>

  <!-- Account -> Redis (check) -->
  <path d="M590,410 L658,330" fill="none" stroke="#b18cf2" stroke-width="1.8" marker-end="url(#arrowPurple)"/>
  <circle r="3.5" fill="#d3b8f7"><animateMotion dur="0.9s" repeatCount="indefinite" path="M590,410 L656,331"/></circle>

  <!-- Redis -> Account (HIT) -->
  <path d="M658,345 Q 620,395 590,420" fill="none" stroke="#4caf7d" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="655" y="400" text-anchor="middle" fill="#4caf7d" font-size="8.5" font-weight="600">HIT</text>

  <!-- Redis -> Primary (MISS compute) -->
  <path d="M770,382 L770,418" fill="none" stroke="#8a8f98" stroke-width="1.4" stroke-dasharray="4,4" marker-end="url(#arrowGrey)"/>
  <text x="825" y="404" text-anchor="middle" fill="#8a8f98" font-size="8">MISS</text>

  <!-- ReplicationJob reads Primary -->
  <path d="M590,660 Q 630,590 660,540" fill="none" stroke="#5bc8e0" stroke-width="1.8" stroke-dasharray="3,3" marker-end="url(#arrowCyan)"/>
  <text x="640" y="605" text-anchor="middle" fill="#5bc8e0" font-size="8.5">read recent</text>

  <!-- ReplicationJob writes Replica -->
  <path d="M590,690 L660,670" fill="none" stroke="#5bc8e0" stroke-width="1.8" stroke-dasharray="3,3" marker-end="url(#arrowCyan)"/>

  <!-- Primary -> Replica direct lag indicator -->
  <path d="M770,570 L770,598" fill="none" stroke="#5bc8e0" stroke-width="2.4" stroke-dasharray="6,3" marker-end="url(#arrowCyan)"/>
  <text x="825" y="588" text-anchor="middle" fill="#5bc8e0" font-size="9" font-weight="600">~5–15s lag</text>

  <!-- Payment(getPayment) -> Replica -->
  <path d="M590,270 Q 900,300 770,598" fill="none" stroke="#8a8f98" stroke-width="1.4" stroke-dasharray="4,4"/>
  <text x="900" y="290" text-anchor="middle" fill="#8a8f98" font-size="8.5">getPayment() reads replica</text>

  <!-- Legend + stats panel -->
  <rect x="920" y="90" width="350" height="650" rx="10" fill="#111826" stroke="#242b36"/>
  <text x="944" y="118" fill="#e6edf3" font-size="13" font-weight="600">Path legend</text>

  <circle cx="952" cy="140" r="4" fill="#5b8def"/><text x="966" y="144" fill="#c9d1d9" font-size="10">Client request</text>
  <circle cx="952" cy="162" r="4" fill="#4caf7d"/><text x="966" y="166" fill="#c9d1d9" font-size="10">Primary write / cache hit</text>
  <circle cx="952" cy="184" r="4" fill="#e0a940"/><text x="966" y="188" fill="#c9d1d9" font-size="10">Kafka publish / consume</text>
  <circle cx="952" cy="206" r="4" fill="#b18cf2"/><text x="966" y="210" fill="#c9d1d9" font-size="10">Cache lookup</text>
  <circle cx="952" cy="228" r="4" fill="#e5534b"/><text x="966" y="232" fill="#c9d1d9" font-size="10">Cache evict (write-side)</text>
  <circle cx="952" cy="250" r="4" fill="#5bc8e0"/><text x="966" y="254" fill="#c9d1d9" font-size="10">Replication job (primary → replica)</text>
  <circle cx="952" cy="272" r="4" fill="#8a8f98"/><text x="966" y="276" fill="#c9d1d9" font-size="10">Replica read / cache miss</text>

  <line x1="944" y1="292" x2="1246" y2="292" stroke="#242b36"/>

  <text x="944" y="316" fill="#e6edf3" font-size="13" font-weight="600">Measured, by tier</text>

  <text x="944" y="340" fill="#7d8590" font-size="9.5">Tier 1 · pool tuning</text>
  <text x="944" y="356" fill="#e6edf3" font-size="11.5" font-weight="700">3.6K → 8.5K req/s</text>

  <text x="944" y="380" fill="#7d8590" font-size="9.5">Tier 2 · sync → async accept</text>
  <text x="944" y="396" fill="#e6edf3" font-size="11.5" font-weight="700">25 → 3,465 req/s · 6.35% → 0% fail</text>

  <text x="944" y="420" fill="#7d8590" font-size="9.5">Tier 2 · consumer concurrency</text>
  <text x="944" y="436" fill="#e6edf3" font-size="11.5" font-weight="700">0.5 → ~1.7 req/s (×3 partitions)</text>

  <text x="944" y="460" fill="#7d8590" font-size="9.5">Tier 3 · balance cache</text>
  <text x="944" y="476" fill="#e6edf3" font-size="11.5" font-weight="700">776 → 29,787 req/s (~38.7x)</text>

  <text x="944" y="500" fill="#7d8590" font-size="9.5">Tier 4 · replication lag window</text>
  <text x="944" y="516" fill="#e6edf3" font-size="11.5" font-weight="700">~5–15s stale reads on replica</text>

  <line x1="944" y1="536" x2="1246" y2="536" stroke="#242b36"/>

  <text x="944" y="560" fill="#e6edf3" font-size="13" font-weight="600">Key lesson, this tier</text>
  <text x="944" y="582" fill="#7d8590" font-size="9.5" font-style="italic">readOnly=true is a routing decision,</text>
  <text x="944" y="596" fill="#7d8590" font-size="9.5" font-style="italic">not a free default. A consumer reading</text>
  <text x="944" y="610" fill="#7d8590" font-size="9.5" font-style="italic">its own just-written row must bypass</text>
  <text x="944" y="624" fill="#7d8590" font-size="9.5" font-style="italic">the replica, or it fails outright.</text>

  <line x1="944" y1="644" x2="1246" y2="644" stroke="#242b36"/>

  <text x="944" y="668" fill="#e6edf3" font-size="13" font-weight="600">Not yet built</text>
  <text x="944" y="690" fill="#7d8590" font-size="10">Circuit breaker (bank call)</text>
  <text x="944" y="708" fill="#7d8590" font-size="10">Real WAL-based replication</text>
  <text x="944" y="726" fill="#7d8590" font-size="10">Ledger partitioning (Tier 5)</text>

</svg>
